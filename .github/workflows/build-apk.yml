
name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - android-port

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  NODE_VERSION: "22"
  KOTLIN_VERSION: "1.8.22"

jobs:
  build-apk:
    name: Build Pasargad APK
    runs-on: ubuntu-22.04

    steps:
      # ===============================================
      # 1. Checkout repository
      # ===============================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ===============================================
      # 2. Setup Node.js 22
      # ===============================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # ===============================================
      # 3. Setup Java 21
      # ===============================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # ===============================================
      # 4. Verify Node.js and Java
      # ===============================================
      - name: Verify Node.js and Java
        shell: bash
        run: |
          set -e

          echo "Node.js version:"
          node --version

          echo "npm version:"
          npm --version

          echo "Java version:"
          java -version

          echo "Javac version:"
          javac -version

          NODE_MAJOR=$(node -p "process.versions.node.split('.')[0]")

          if [ "$NODE_MAJOR" -lt 22 ]; then
            echo "ERROR: Node.js 22 or newer is required."
            exit 1
          fi

          JAVA_MAJOR=$(java -version 2>&1 | sed -n 's/.*version "\( [0-9]* \).*/\1/p' | tr -d ' ')

          if ! java -version 2>&1 | grep -q '"21'; then
            echo "ERROR: Java 21 is required."
            exit 1
          fi

      # ===============================================
      # 5. Configure Android SDK paths
      # ===============================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/tools/bin" >> "$GITHUB_PATH"

      # ===============================================
      # 6. Install Android SDK packages
      # ===============================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "ERROR: sdkmanager was not found."
            find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          echo "Using SDK Manager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ===============================================
      # 7. Install npm dependencies
      # ===============================================
      - name: Install npm dependencies
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # ===============================================
      # 8. Install Capacitor
      # ===============================================
      - name: Install Capacitor packages
        shell: bash
        run: |
          set -e

          npm install --no-save \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android

      # ===============================================
      # 9. Verify Capacitor CLI
      # ===============================================
      - name: Verify Capacitor CLI
        shell: bash
        run: |
          set -e

          echo "Capacitor version:"
          npx cap --version

      # ===============================================
      # 10. Prepare web directory
      # ===============================================
      - name: Prepare web directory
        shell: bash
        run: |
          set -e

          rm -rf www
          mkdir -p www

          # Main HTML files
          if [ -f index.html ]; then
            cp index.html www/
          fi

          if [ -f cheque.html ]; then
            cp cheque.html www/
          fi

          if [ -f splash.html ]; then
            cp splash.html www/
          fi

          if [ -f confirm-worker.js ]; then
            cp confirm-worker.js www/
          fi

          # Web resources
          if [ -d css ]; then
            cp -r css www/
          fi

          if [ -d js ]; then
            cp -r js www/
          fi

          if [ -d assets ]; then
            cp -r assets www/
          fi

          if [ -d database ]; then
            cp -r database www/
          fi

          echo "Web directory contents:"
          find www -maxdepth 3 -type f | sort

      # ===============================================
      # 11. Create Capacitor configuration
      # ===============================================
      - name: Create Capacitor configuration
        shell: bash
        run: |
          set -e

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.pasargad.app",
            "appName": "Pasargad",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          echo "Capacitor configuration:"
          cat capacitor.config.json

      # ===============================================
      # 12. Add Android platform
      # ===============================================
      - name: Add Android platform
        shell: bash
        run: |
          set -e

          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform already exists."
          fi

      # ===============================================
      # 13. Configure Android SDK location
      # ===============================================
      - name: Configure local.properties
        shell: bash
        run: |
          set -e

          mkdir -p android

          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

          echo "Android local.properties:"
          cat android/local.properties

      # ===============================================
      # 14. Synchronize Capacitor
      # ===============================================
      - name: Capacitor sync
        shell: bash
        run: |
          set -e

          npx cap sync android

      # ===============================================
      # 15. Fix Kotlin duplicate classes
      # ===============================================
      - name: Fix Kotlin duplicate classes
        shell: bash
        run: |
          set -e

          ANDROID_BUILD_FILE="android/build.gradle"

          if [ ! -f "$ANDROID_BUILD_FILE" ]; then
            echo "ERROR: android/build.gradle was not found."
            exit 1
          fi

          if ! grep -q "Kotlin dependency compatibility fix" "$ANDROID_BUILD_FILE"; then
            cat >> "$ANDROID_BUILD_FILE" <<'EOF'

          // Kotlin dependency compatibility fix
          allprojects {
              configurations.configureEach {
                  resolutionStrategy {
                      force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
                  }
              }
          }
          EOF
          fi

          echo "Kotlin resolution strategy configured."

      # ===============================================
      # 16. Configure Gradle properties
      # ===============================================
      - name: Configure Gradle properties
        shell: bash
        run: |
          set -e

          GRADLE_PROPERTIES="android/gradle.properties"

          touch "$GRADLE_PROPERTIES"

          if ! grep -q "^android.useAndroidX=" "$GRADLE_PROPERTIES"; then
            echo "android.useAndroidX=true" >> "$GRADLE_PROPERTIES"
          fi

          if ! grep -q "^android.enableJetifier=" "$GRADLE_PROPERTIES"; then
            echo "android.enableJetifier=true" >> "$GRADLE_PROPERTIES"
          fi

          if ! grep -q "^org.gradle.jvmargs=" "$GRADLE_PROPERTIES"; then
            echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> "$GRADLE_PROPERTIES"
          fi

          if ! grep -q "^kotlin.code.style=" "$GRADLE_PROPERTIES"; then
            echo "kotlin.code.style=official" >> "$GRADLE_PROPERTIES"
          fi

          echo "Gradle properties:"
          cat "$GRADLE_PROPERTIES"

      # ===============================================
      # 17. Configure Java 21 compile options
      # ===============================================
      - name: Configure Java 21 compile options
        shell: bash
        run: |
          set -e

          APP_BUILD_FILE="android/app/build.gradle"

          if [ ! -f "$APP_BUILD_FILE" ]; then
            echo "ERROR: android/app/build.gradle was not found."
            exit 1
          fi

          if ! grep -q "JavaVersion.VERSION_21" "$APP_BUILD_FILE"; then
            cat >> "$APP_BUILD_FILE" <<'EOF'

          // Java 21 compatibility configuration
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }
          }
          EOF
          fi

          echo "Java 21 compile options configured."

      # ===============================================
      # 18. Check Gradle and Kotlin dependencies
      # ===============================================
      - name: Check Gradle dependencies
        working-directory: android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            :app:dependencies \
            --configuration debugRuntimeClasspath \
            --no-daemon \
            --stacktrace

      # ===============================================
      # 19. Clean Android project
      # ===============================================
      - name: Clean Android project
        working-directory: android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew clean --no-daemon

      # ===============================================
      # 20. Build Debug APK
      # ===============================================
      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      # ===============================================
      # 21. Check APK output
      # ===============================================
      - name: Check APK output
        shell: bash
        run: |
          set -e

          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK file was not generated."

            find android/app/build \
              -type f 2>/dev/null || true

            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK_PATH"

      # ===============================================
      # 22. Upload APK artifact
      # ===============================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pasargad-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14